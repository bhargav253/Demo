// Initial BookSim sanity model.
// A k-ary 1-fly is one radix-k router with k sources and k destinations.
topology = fly;
k = 8;
n = 1;
routing_function = dest_tag;

// Stock input-queued router with credit-based flow control.
router = iq;
num_vcs = 1;
vc_buf_size = 8;
wait_for_tail_credit = 1;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;

routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
credit_delay = 1;

input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;

// One BookSim flit represents one 256-byte DAT transfer on a lane.
traffic = uniform;
injection_process = bernoulli;
packet_size = 1;
injection_rate = 0.02;

sim_type = latency;
warmup_periods = 3;
sample_period = 1000;
max_samples = 10;
sim_count = 1;
seed = 1;
