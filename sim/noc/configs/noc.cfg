Hashing / Routing
-----------------------------------------------------------------------------------
simplest interleaving shceme, nothing fancy
  -for 12LLCH case -> LLCH# = (addr>>10)%12
  -for 16LLCH case -> LLCH# = (addr>>10)%16

Lane hash -> simple addr[9:8] determines lane

Routing -> X then Y for all commands

-----------------------------------------------------------------------------------
Initial topology-model decisions
-----------------------------------------------------------------------------------
- Every adjacent router/endpoint link has one cycle of propagation latency.
- L1 and L2 use four lane-preserving DAT lanes.
- L3 uses one DAT lane.
- A separate L3/L2 shim performs lane conversion; neither router is special-cased.
  * The initial shim is a one-cycle pipelined topology component and can accept a
    new transfer every cycle when its selected downstream side has capacity.
  * L3 -> L2: select one of four L2 lanes using the request-address lane hash;
    at most one packet is injected per shim per cycle.
  * L2 -> L3: round-robin arbitrate across the four L2 lanes; at most one packet
    is ejected into L3 per shim per cycle.
  * Detailed shim buffering and credit organization are deferred.  The topology
    model must count shim arbitration loss/stalls separately so that the shim can
    be refined if it limits throughput.
- Only CMD participates in routing and switch arbitration.  DAT carries payload
  and follows its associated command by exactly two cycles on the path reserved
  by that command.  CMD uses deterministic X-then-Y routing; DAT does not make an
  independent routing or arbitration decision.
- On CMD admission, a router reserves a payload slot for a normal transfer or a
  future output-lane time for a bypass transfer.  Each input lane has a two-entry
  CMD-to-DAT alignment pipeline carrying valid, slot index, bypass disposition,
  and any reserved output identity needed when the corresponding DAT arrives.
- VOQ insertion and arbitration operate on CMD and are not gated on DAT arrival.
  The fixed two-cycle CMD-to-DAT offset and credit-reserved payload slot guarantee
  that DAT is present when the scheduled payload action occurs.  A 1R1W bank may
  write the arriving DAT while reading another queued slot in the same cycle.
- If the scheduled read names the same slot receiving DAT in that cycle, use an
  explicit write-to-read forwarding path (or an SRAM macro with guaranteed
  write-through behavior); do not depend on unspecified read-during-write data.
- A bypass grant consumes downstream capacity and reserves the output DAT lane
  two cycles in advance; it cannot be cancelled when DAT arrives.
- CDMA may inject and eject on all four L2 lanes, up to four DAT transfers/cycle
  when lane credits and arbitration permit.
- Initial VC use:
  * VC0 = requests and write traffic travelling toward an LLCH.
  * VC1 = responses and read data travelling toward a PE/requester.
- HBM stack-to-LLCH pairing is deferred; the first topology study treats LLCHs
  as independent endpoints.
