-----------------------------------------------------------------------------------
Topology 16C LLCH
-----------------------------------------------------------------------------------
L1 routers form a row-major 4x4 mesh:

  L1_00 L1_01 L1_02 L1_03
  L1_04 L1_05 L1_06 L1_07
  L1_08 L1_09 L1_10 L1_11
  L1_12 L1_13 L1_14 L1_15

LLCH numbering proceeds clockwise around the perimeter, beginning above L1_00.
L1 ports alternate between L2-corner and cardinal links:
p0=local/NW L2, p1=north, p2=NE L2, p3=east,
p4=SE L2, p5=south, p6=SW L2, p7=west.
At the perimeter, a cardinal port terminates at an LLCH.  X denotes a
physically omitted clipped-grid corner and is modeled as an inert port.

