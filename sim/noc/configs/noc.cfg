-----------------------------------------------------------------------------------
Topology 12 LLCH
-----------------------------------------------------------------------------------
L1 routers form a row-major 3x3 mesh inside a row-major 4x4 array of L2/cluster
regions.  L1 port placement is:

  p0=west, p1=northwest L2, p2=north, p3=northeast L2,
  p4=east, p5=southeast L2, p6=south, p7=southwest L2.

At the perimeter, a cardinal L1 port terminates at an LLCH.  LLCH numbering
proceeds clockwise, beginning above L1_00.

