// Directed CSV trace: input port 0 lanes 0/1 -> output port 1 lanes 0/1.
topology = fly;
k = 32;
n = 1;
routing_function = dest_tag;

router = lane_voq;
voq_ports = 8;
voq_lanes = 4;
num_vcs = 1;
vc_buf_size = 4;
voq_shared_buf_size = 16;
wait_for_tail_credit = 0;

alloc_iters = 1;
credit_delay = 1;
internal_speedup = 1.0;

traffic = fixed_port_lane({8,4,1});
injection_process = bernoulli_sources({{0,1}});
packet_size = 1;
injection_rate = 0.50;

voq_trace_file = results/lane_voq_trace_2lane.csv;
sim_type = latency;
warmup_periods = 1;
sample_period = 200;
max_samples = 3;
sim_count = 1;
seed = 7;
