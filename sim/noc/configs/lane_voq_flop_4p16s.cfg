// One physical router: 8 port groups x 4 lane-preserving channels.
topology = fly;
k = 32;
n = 1;
routing_function = dest_tag;

router = lane_voq;
voq_ports = 8;
voq_lanes = 4;

// Four credits are initially published per lane. The receiver owns another
// 16 unpublished shared tokens: 4*4 + 16 = 32 payload entries/input port.
num_vcs = 1;
vc_buf_size = 4;
voq_shared_buf_size = 16;
wait_for_tail_credit = 0;

alloc_iters = 1;
credit_delay = 1;
internal_speedup = 1.0;

traffic = lane_uniform({8,4});
injection_process = bernoulli;
packet_size = 1;
injection_rate = 0.02;

sim_type = latency;
warmup_periods = 3;
sample_period = 1000;
max_samples = 10;
sim_count = 1;
seed = 1;
