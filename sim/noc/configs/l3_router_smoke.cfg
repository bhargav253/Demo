// One-lane L3 instance used to validate heterogeneous NoC construction.
topology = fly;
k = 5;
n = 1;
routing_function = dest_tag;
router = lane_voq;
voq_ports = 5;
voq_lanes = 1;
num_vcs = 2;
vc_buf_size = 12;
voq_shared_buf_size = 0;
voq_total_buf_size = 12;
voq_storage = sram_fixed;
voq_bank_policy = fixed;
voq_vc_sharing = 1;
voq_reserved_per_vc = 1;
voq_tagged_credits = 0;
voq_credit_policy = shared_first;
voq_bypass = 1;
voq_allocator = islip;
voq_read_latency = 3;
voq_lookaside_size = 0;
wait_for_tail_credit = 0;
alloc_iters = 2;
credit_delay = 1;
internal_speedup = 1.0;
traffic = lane_uniform({5,1});
injection_process = bernoulli;
packet_size = 1;
injection_rate = 0.20;
sim_type = latency;
warmup_periods = 1;
sample_period = 200;
max_samples = 3;
sim_count = 1;
seed = 19;
