# Axon policy enforcement is intentionally manual during the Stage 0 cleanup.
# Run with: pre-commit run axon-repo-policy --hook-stage manual --all-files
# Change `stages` to [pre-commit] only after the existing RTL/core baseline is clean.
repos:
  - repo: local
    hooks:
      - id: axon-repo-policy
        name: Axon repository policy
        entry: python3 tools/checks/check_repo_policy.py
        language: system
        files: '\.(sv|svh|core)$'
        stages: [manual]
