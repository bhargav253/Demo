// T2: ports 0..6 lane 0 -> output port 7 lane 0.
topology = fly;
k = 32;
n = 1;
routing_function = dest_tag;
router = lane_voq;
voq_ports = 8;
voq_lanes = 4;
num_vcs = 1;
vc_buf_size = 4;
voq_shared_buf_size = 16;
wait_for_tail_credit = 0;
alloc_iters = 1;
credit_delay = 1;
internal_speedup = 1.0;
traffic = fixed_port_lane({8,4,7});
injection_process = bernoulli_sources({{0,4,8,12,16,20,24}});
packet_size = 1;
injection_rate = 0.10;
voq_trace_file = results/t2_all_ports_one_lane_hotspot.csv;
sim_type = latency;
warmup_periods = 1;
sample_period = 500;
max_samples = 10;
sim_count = 1;
seed = 12;
